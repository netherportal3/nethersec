name: Host scripts

on:
  push:
    branches: [main]
    paths:
      - 'host/**'
      - '.github/workflows/host.yml'
  pull_request:
    paths:
      - 'host/**'
      - '.github/workflows/host.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Harnesses
        run: sh host/test/run-all.sh
      - name: ShellCheck (errors only)
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version
          shellcheck -S error host/*.sh host/test/*.sh
