version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a hijacked version has time to be caught.
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The image stays on a long-term support line of Node; moving to the next one is done by hand.
      - dependency-name: node
        update-types: ['version-update:semver-major']
