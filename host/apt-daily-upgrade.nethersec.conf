# Drop-in for Ubuntu's apt-daily-upgrade.service (the unit that runs
# unattended-upgrades). install.sh --with-applier installs it verbatim to
#   /etc/systemd/system/apt-daily-upgrade.service.d/nethersec-apply-aged.conf
# then runs `systemctl daemon-reload`.
#
# WHY: unattended-upgrades (u-u) skips every dpkg-HELD package ("Package X is marked
# to be held back"). The release-age applier re-checks its holds against the apt lists
# once an hour, but nothing ran it just before u-u. So a hold that went stale when
# apt-daily refreshed the lists (a -updates version that has now reached -security)
# would live on into the u-u window, and a real security fix would wait a full extra
# day (and page "Security updates stuck"). This runs the applier
# once more right before u-u picks its set, on the same lists u-u is about to use.
#
# WHY IT IS SAFE:
#   * ExecStartPre lines ADD to the stock unit's list, so these run after the stock
#     `apt-helper wait-online` and before `apt.systemd.daily install` (u-u). Never add
#     an empty `ExecStartPre=` here: that would wipe the stock wait-online step.
#   * `systemctl start` BLOCKS until the applier (Type=oneshot) finishes, bounded by
#     its own TimeoutStartSec=1800. Never add --no-block: finishing before u-u is the
#     whole point. If the hourly timer run is already going, this start joins that run
#     and waits for it. systemd runs one instance of a unit at a time, so the two can
#     never overlap and the applier's own mkdir lock never fights itself.
#   * The SECOND line waits until the applier is no longer running. Normally it returns
#     at once (the start above already waited). It matters when the blocking start
#     returns EARLY: a LIVE applier that upgrades systemd triggers a PID 1 re-exec from
#     systemd's postinst, which drops systemctl's bus connection, so the start errors
#     out (ignored by '-') while the applier's apt-get/dpkg is still running. u-u would
#     then fail to take the dpkg lock and skip the whole day. It polls
#     `systemctl is-active` every 5s until the unit is active/inactive/failed. An
#     empty or unknown answer (PID 1 mid re-exec) keeps waiting. At most 360 x 5s =
#     1800s, the applier's own start timeout, so it can never hold u-u back for good.
#     `$$` is systemd's escape for a literal `$`.
#   * In LIVE mode the applier may run `apt-get install` here. That finishes before
#     u-u starts: one after the other, no dpkg lock fight.
#   * Kill switch / HOSTSEC_APPLY_ENABLED=0: the applier releases all of its holds and
#     exits 0, so u-u sees none of our holds (fails toward patched).
#   * The leading '-' ignores any failure (applier unit not installed or removed, a
#     timeout, a start refused during shutdown): u-u ALWAYS still runs. A missing unit
#     reads as `inactive`, so the wait returns at once.
#   * NO DEADLOCK: this waits on nethersec-apply-aged.service from INSIDE
#     apt-daily-upgrade.service's start. So nethersec-apply-aged.service must NEVER
#     get After=/Requires=/Wants=/Requisite=/BindsTo=/PartOf= on
#     apt-daily-upgrade.service. With After=, each start would wait for the other and
#     hang for good (a oneshot u-u has no start timeout). The others would pull u-u
#     into every hourly applier run. The applier harness checks this.
#
# UNINSTALL: this file keeps starting the applier every day even after its timer is
# disabled, so removing the applier means removing THIS file too:
#   sudo rm -f /etc/systemd/system/apt-daily-upgrade.service.d/nethersec-apply-aged.conf
#   sudo systemctl daemon-reload
[Service]
ExecStartPre=-/bin/systemctl start nethersec-apply-aged.service
ExecStartPre=-/bin/sh -c 'i=0; while [ "$$i" -lt 360 ]; do case "$$(systemctl is-active nethersec-apply-aged.service 2>/dev/null)" in active|inactive|failed) exit 0 ;; esac; i=$$((i + 1)); sleep 5; done'
